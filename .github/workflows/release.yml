name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release.py'
      - 'scripts/tests/test_install.py'
      - 'install.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os,tomllib; from pathlib import Path; version=tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+version, "tag does not match Cargo.toml"'
      - name: Build native release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package with checksum
        run: python scripts/release.py package --target ${{ matrix.target }}
      - name: Verify extracted executable
        run: python scripts/release.py verify --target ${{ matrix.target }} --archive release-assets/scoutpack-${{ matrix.target }}.${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: scoutpack-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
