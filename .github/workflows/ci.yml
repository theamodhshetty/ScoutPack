name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test
      - run: bash -n install.sh
      - run: bash -n scripts/bench-real-repos.sh
      - run: bash -n scripts/bench-one-repo.sh
      - run: sh install.sh --help
