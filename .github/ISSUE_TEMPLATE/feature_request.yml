name: Feature request
description: Suggest a ScoutPack improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should ScoutPack do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - scanning
        - indexing
        - search ranking
        - context packet
        - JSON output
        - MCP
        - docs
    validations:
      required: true

