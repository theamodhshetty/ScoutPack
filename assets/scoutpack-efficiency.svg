<svg width="920" height="420" viewBox="0 0 920 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ScoutPack efficiency model</title>
  <desc id="desc">Visual model showing broad repo scanning compared with a focused ScoutPack packet.</desc>
  <style>
    .title { font: 800 34px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .label { font: 700 21px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .text { font: 500 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .mono { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; letter-spacing: 0; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .card { fill: #111827; stroke: #334155; }
      .title { fill: #f8fafc; }
      .label { fill: #f8fafc; }
      .text { fill: #cbd5e1; }
      .axis { stroke: #475569; }
    }
  </style>
  <rect class="bg" width="920" height="420" rx="30" fill="#F8FAFC"/>
  <text class="title" x="42" y="58" fill="#0F172A">Less repo wandering. More useful first context.</text>
  <text class="text" x="44" y="92" fill="#64748B">Illustrative model: set a budget, pack task-specific context, keep the agent on the right files.</text>

  <rect class="card" x="42" y="122" width="390" height="230" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text class="label" x="72" y="162" fill="#0F172A">Broad agent scan</text>
  <text class="text" x="72" y="194" fill="#64748B">Manual file hunting, broad reads, repeated context.</text>
  <rect x="72" y="228" width="292" height="34" rx="9" fill="#EF4444"/>
  <rect x="72" y="278" width="250" height="34" rx="9" fill="#F97316"/>
  <rect x="72" y="328" width="210" height="10" rx="5" fill="#CBD5E1"/>
  <text class="mono" x="378" y="252" text-anchor="end" fill="#7F1D1D">10k+</text>
  <text class="mono" x="337" y="302" text-anchor="end" fill="#7C2D12">high</text>
  <text class="text" x="72" y="374" fill="#64748B">More tokens before first useful edit</text>

  <rect class="card" x="488" y="122" width="390" height="230" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text class="label" x="518" y="162" fill="#0F172A">ScoutPack packet</text>
  <text class="text" x="518" y="194" fill="#64748B">Ranked files, symbols, commands, risks, snippets.</text>
  <rect x="518" y="228" width="110" height="34" rx="9" fill="#14B8A6"/>
  <rect x="518" y="278" width="92" height="34" rx="9" fill="#6366F1"/>
  <rect x="518" y="328" width="252" height="10" rx="5" fill="#F59E0B"/>
  <text class="mono" x="642" y="252" fill="#115E59">2.5k</text>
  <text class="mono" x="625" y="302" fill="#3730A3">low</text>
  <text class="text" x="518" y="374" fill="#64748B">Smaller start, clearer edit path</text>

  <line class="axis" x1="72" y1="214" x2="842" y2="214" stroke="#E2E8F0"/>
  <text class="mono" x="72" y="217" fill="#64748B" transform="translate(0 -10)">context tokens</text>
  <text class="mono" x="72" y="267" fill="#64748B" transform="translate(0 -10)">search friction</text>
  <text class="mono" x="72" y="327" fill="#64748B" transform="translate(0 -10)">task signals</text>

  <path d="M430 226C455 226 465 226 490 226" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <path d="M475 214L491 226L475 238" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
